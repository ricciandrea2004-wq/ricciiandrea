<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block">
<style>
html,body{margin:0}
body{width:1200px;height:630px;background:#ffffff;font-family:Inter,sans-serif;color:#37352f;-webkit-font-smoothing:antialiased}
.card{box-sizing:border-box;width:1200px;height:630px;padding:84px 88px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#fff 0%,#f7f7f5 100%)}
.logo{display:flex;align-items:center;gap:26px}
.logo svg{width:96px;height:96px}
.wm{font-weight:700;font-size:76px;letter-spacing:-0.025em;line-height:1}
.wm span{color:#1a6fd0}
h1{font-size:46px;line-height:1.22;font-weight:600;letter-spacing:-0.015em;margin:0;max-width:1024px;text-wrap:balance}
.foot{display:flex;gap:12px;align-items:center;font-size:24px;color:rgba(55,53,47,.72);font-weight:500}
.tag{padding:6px 14px;border-radius:8px;font-size:22px}
.b{background:#e7f3f8;color:#2b6f99}.p{background:#f4f0f7;color:#7c4fa3}.o{background:#fbecdd;color:#a35508}
</style></head><body><div class="card">
<div class="logo"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#37352f"/><path d="M38.72 41A14 14 0 1 1 38.72 23" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="47" cy="43" r="4.5" fill="#5aa5e6"/></svg><div class="wm">competia<span>.</span>work</div></div>
<h1>Segnali competitivi verificabili su prezzi, assortimento e promozioni, collegati alle fonti.</h1>
<div class="foot"><span class="tag b">Prezzi</span><span class="tag p">Assortimento</span><span class="tag o">Promozioni</span><span style="margin-left:12px">Intelligence commerciale B2B</span></div>
</div></body></html>
